
name: Extract Website ZIP

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          ZIP="Pinec-Hotel-website-ready.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ZIP file not found"
            exit 1
          fi

          mkdir /tmp/website
          unzip -q "$ZIP" -d /tmp/website

          INDEX=$(find /tmp/website -name index.html -type f | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "index.html not found"
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX")
          cp -a "$SITE_DIR"/. .
          rm "$ZIP"

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Extract hotel website"
          git push
          
