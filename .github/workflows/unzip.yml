
name: Extract Website ZIP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract website ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "No ZIP file found!"
            exit 1
          fi

          mkdir /tmp/website

          unzip -q "$ZIP" -d /tmp/website

          INDEX=$(find /tmp/website -name index.html -type f | head -n 1)

          if [ -z "$INDEX" ]; then
            echo "No index.html found!"
            exit 1
          fi

          SITE_DIR=$(dirname "$INDEX")

          cp -a "$SITE_DIR"/. .

          rm "$ZIP"

      - name: Commit extracted website
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          git diff --cached --quiet || git commit -m "Add website files"

          git push
          
